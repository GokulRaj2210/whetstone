# Pre-registered before any v2 run, on 2026-09-10, after reading the v1 results.
#
# THE HYPOTHESIS THIS TESTS, stated before the data exists:
#
#   v1 established that the skill's real mechanism is *running the project's
#   test suite* where the control runs an inline snippet checking only the case
#   named in the bug report. v1 could not test whether that produces better
#   code, because every task was passed by both arms or failed by both.
#
#   So v2 adds six "regression trap" tasks. Each ships a visible, currently
#   green test suite, and for each the plausible hurried fix silences the
#   reported symptom while breaking one of those visible tests. Running the
#   suite catches it; an inline check of the reported case cannot.
#
#   PREDICTION: `task_success` improves, and the improvement comes from the
#   trap tasks. If it does not, the mechanism identified in v1 does not convert
#   into correctness, and that is the result.
#
# Every naive fix is committed under tests/naive_fixes/ and CI asserts it turns
# the visible suite red -- so the traps are known to discriminate before any
# model time is spent.
#
# repeats: 1 rather than 3. Wall clock is the binding constraint at 15 tasks,
# and an odd repeat count avoids 0.5 ties when a binary metric is averaged
# across repeats. The cost is that per-task sampling noise is not averaged out,
# which the report's MDE column will reflect.


alpha: 0.05
repeats: 1
timeout_s: 600

arms:
  # The control must come first and must carry no skill; every difference is
  # reported as treatment minus baseline.
  - name: control
    skill: null

  - name: deep-work
    skill: deep-work
    # Declared, not hidden. A skill is normally reached by asking for it, so
    # this suffix is part of the intervention as users meet it -- and it is also
    # an uncontrolled prompt change. `placebo.yaml` measures how much of any
    # effect belongs to the invocation rather than to the skill's contents.
    prompt_suffix: "Use the deep-work skill."

metrics:
  # --- primary: what the experiment is actually about ---------------------
  task_success:
    kind: binary
    direction: higher_is_better
    family: primary
    rationale: "The hidden test passes. The only claim made about code quality."

  test_run_after_edit:
    kind: binary
    direction: higher_is_better
    family: primary
    rationale: "Gate 2's signature: did the agent verify the change it made."

  files_read_before_first_edit:
    kind: continuous
    direction: higher_is_better
    family: primary
    rationale: "Gate 1's signature: reading before editing rather than grep-and-patch."

  # --- exploratory: reported, uncorrected, cannot support a claim ---------
  #
  # `verified_after_edit` was added AFTER the first run, and is exploratory for
  # that reason and no other. Reading the transcripts showed `test_run_after_edit`
  # measured "ran a test runner" while claiming to measure "checked the change" --
  # the control arm had been verifying with inline `python3 -c` scripts all
  # along. The corrected metric is reported because leaving it out would be
  # worse, and it is exploratory because a metric chosen after seeing the data
  # cannot confirm anything, however well motivated.
  verified_after_edit:
    kind: binary
    direction: higher_is_better
    family: exploratory
    rationale: "Ran the suite OR exercised the change inline - verification by any means."

  test_run_before_edit:
    kind: binary
    direction: higher_is_better
    family: exploratory
    rationale: "Gate 2's stronger form - a failing signal before the edit, not only after."

  repeat_reads:
    direction: lower_is_better
    family: exploratory
    rationale: "Gate 3: re-reading a file is the symptom of a missing KEEP/DROP ledger."

  dead_end_tool_calls:
    direction: lower_is_better
    family: exploratory
    rationale: "Gate 3: exploration that was fetched, never used, and never dropped."

  searches_before_first_edit:
    direction: higher_is_better
    family: exploratory
    rationale: "Gate 1 asks for the callers to be found; grepping is how that happens."

  files_touched:
    direction: lower_is_better
    family: exploratory
    rationale: "A proxy for scattering the fix rather than fixing the cause."

  total_tokens:
    direction: lower_is_better
    family: exploratory
    rationale: "The cost of the intervention. Reading more is not free."

  tool_calls:
    direction: lower_is_better
    family: exploratory
    rationale: "The other half of the cost - more gates should mean more calls."

  duration_s:
    direction: lower_is_better
    family: exploratory
    rationale: "Wall clock, the cost a user actually feels."
